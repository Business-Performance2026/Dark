<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة إدارة دارك 🛠️</title>
<link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#16283a;--navy2:#1f3a54;--gold:#b98d4e;--gold2:#d4ae7a;--bg:#f4f1ea;--muted:#6b7280;--red:#b91c1c;--green:#15803d}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:var(--bg);min-height:100vh}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}
/* ===== شاشة الدخول ===== */
#loginScreen{min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#0f1e2e,var(--navy) 60%,#24405e);padding:20px}
.login-card{background:#fff;border-radius:24px;padding:34px 28px;width:min(400px,100%);text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.login-card img{width:74px;height:74px;border-radius:18px;margin-bottom:12px}
.login-card h1{color:var(--navy);font-size:1.3rem}
.login-card p{color:var(--muted);font-size:.85rem;margin:6px 0 20px}
.fg{margin-bottom:12px;text-align:start}
.fg label{display:block;font-weight:700;color:var(--navy);font-size:.8rem;margin-bottom:5px}
.fg input{width:100%;padding:11px 14px;border:1.5px solid #e7e3da;border-radius:11px;font-size:.9rem;background:#fbfaf7}
.submit{width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;font-weight:800;font-size:.95rem}
.login-err{color:var(--red);font-size:.8rem;margin-top:10px;min-height:1.2em}
/* ===== هيكل اللوحة ===== */
#adminApp{display:none;min-height:100vh}
.topbar{background:var(--navy);color:#fff;padding:12px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50;flex-wrap:wrap}
.topbar img{width:42px;height:42px;border-radius:11px;background:#fff;padding:3px}
.topbar h1{font-size:1.05rem;font-weight:800}
.topbar .spacer{flex:1}
.topbar a{color:#d7e2ee;text-decoration:none;font-size:.8rem;font-weight:700}
.topbar a:hover{color:var(--gold2)}
.out-btn{background:rgba(255,255,255,.12);border:none;color:#fff;padding:8px 16px;border-radius:10px;font-weight:700;font-size:.8rem}
.tabs{display:flex;gap:6px;background:#fff;padding:10px 22px;overflow-x:auto;box-shadow:0 2px 10px rgba(22,40,58,.06);position:sticky;top:66px;z-index:40;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1.5px solid #e8e2d6;background:#fff;color:var(--navy);padding:8px 16px;border-radius:30px;font-weight:700;font-size:.8rem;transition:.2s;white-space:nowrap}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabs button .cnt{background:var(--gold);color:#fff;border-radius:20px;font-size:.68rem;padding:1px 8px;margin-inline-start:6px}
main{padding:22px;max-width:1200px;margin:0 auto}
/* إحصائيات */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat{background:#fff;border-radius:16px;padding:16px 14px;text-align:center;border-bottom:3px solid var(--gold);box-shadow:0 3px 10px rgba(22,40,58,.05)}
.stat b{display:block;font-size:1.5rem;font-weight:900;color:var(--navy)}
.stat span{font-size:.74rem;color:var(--muted);font-weight:700}
.stat.g{border-color:var(--green)}.stat.g b{color:var(--green)}
.stat.r{border-color:var(--red)}.stat.r b{color:var(--red)}
.stat.o{border-color:#b45309}.stat.o b{color:#b45309}
/* بطاقات المحتوى */
.card{background:#fff;border-radius:18px;box-shadow:0 3px 12px rgba(22,40,58,.06);overflow:hidden;margin-bottom:18px}
.card-h{padding:14px 18px;border-bottom:1px solid #f0ece4;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.card-h h2{color:var(--navy);font-size:1rem}
.card-h .tools{display:flex;gap:8px}
.card-h input[type=search]{padding:8px 14px;border:1.5px solid #e7e3da;border-radius:10px;font-size:.82rem;width:min(240px,60vw)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{background:#faf7f0;color:var(--gold);font-size:.74rem;padding:10px 12px;text-align:start;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #f5f1e8;font-size:.82rem;color:var(--navy);vertical-align:middle}
.badge{display:inline-block;padding:3px 11px;border-radius:20px;font-size:.7rem;font-weight:700;white-space:nowrap}
.b-green{background:#dcfce7;color:var(--green)}
.b-red{background:#fee2e2;color:var(--red)}
.b-amber{background:#fef3c7;color:#b45309}
.b-gray{background:#f3f4f6;color:var(--muted)}
.abtn{border:none;border-radius:9px;padding:5px 11px;font-size:.72rem;font-weight:800;margin:2px}
.abtn.g{background:#dcfce7;color:var(--green)}
.abtn.r{background:#fee2e2;color:var(--red)}
.abtn.o{background:#fef3c7;color:#b45309}
.abtn.n{background:#e8eef5;color:var(--navy)}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:.85rem}
/* نماذج */
.panel{padding:18px}
.slide-box{border:1.5px solid #eee6d8;border-radius:14px;padding:14px;margin-bottom:14px}
.slide-box h3{color:var(--gold);font-size:.85rem;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
/* مودال السبب */
.overlay{position:fixed;inset:0;background:rgba(15,30,46,.6);display:none;place-items:center;z-index:200;padding:20px}
.overlay.open{display:grid}
.modal{background:#fff;border-radius:20px;padding:24px;width:min(440px,100%)}
.modal h3{color:var(--navy);margin-bottom:12px;font-size:1rem}
.modal textarea{width:100%;padding:11px;border:1.5px solid #e7e3da;border-radius:11px;min-height:90px;font-size:.88rem}
.modal .row{display:flex;gap:8px;margin-top:14px}
.modal .row button{flex:1;padding:10px;border:none;border-radius:11px;font-weight:800}
.m-ok{background:var(--navy);color:#fff}
.m-no{background:#f3f4f6;color:var(--muted)}
/* توست */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:11px 24px;border-radius:40px;font-size:.85rem;font-weight:700;opacity:0;transition:.3s;z-index:400}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}
@media(max-width:820px){
  main{padding:14px}
  .tabs{top:62px;padding:8px 12px}
  table{min-width:0}
  table thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr{border:1px solid #f0ece4;border-radius:14px;margin:10px 12px;padding:8px 12px}
  td{border:none;padding:4px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
  td::before{content:attr(data-l);font-weight:700;color:var(--gold);font-size:.7rem;white-space:nowrap}
}
</style>
</head>
<body>

<!-- شاشة الدخول -->
<div id="loginScreen">
  <div class="login-card">
    <img src="assets/logo.png" alt="دارك">
    <h1>لوحة إدارة دارك 🛠️</h1>
    <p>دخول المشرف فقط — إدارة شاملة للمنصة</p>
    <form id="loginForm">
      <div class="fg"><label>البريد الإلكتروني</label><input type="email" id="lEmail" required dir="ltr" style="text-align:end"></div>
      <div class="fg"><label>كلمة المرور</label><input type="password" id="lPass" required dir="ltr" style="text-align:end"></div>
      <button class="submit" id="lBtn" type="submit">دخول 🔐</button>
      <div class="login-err" id="lErr"></div>
    </form>
  </div>
</div>

<!-- اللوحة -->
<div id="adminApp">
  <div class="topbar">
    <img src="assets/logo.png" alt="">
    <h1>لوحة إدارة دارك</h1>
    <span class="spacer"></span>
    <a href="index.html" target="_blank">🌐 فتح التطبيق</a>
    <button class="out-btn" id="logoutBtn">خروج 🚪</button>
  </div>
  <div class="tabs" id="tabs">
    <button data-t="overview" class="on" type="button">📊 نظرة عامة</button>
    <button data-t="companies" type="button">🏢 الشركات <span class="cnt" id="cntCompanies">0</span></button>
    <button data-t="clients" type="button">👤 العملاء <span class="cnt" id="cntClients">0</span></button>
    <button data-t="requests" type="button">📋 الطلبات <span class="cnt" id="cntRequests">0</span></button>
    <button data-t="quotes" type="button">💰 عروض الأسعار <span class="cnt" id="cntQuotes">0</span></button>
    <button data-t="employees" type="button">👷 الموظفون <span class="cnt" id="cntEmployees">0</span></button>
    <button data-t="cats" type="button">🗂️ الأقسام</button>
    <button data-t="techcats" type="button">🔧 تخصصات الفنيين</button>
    <button data-t="ads" type="button">🖼️ الإعلانات</button>
    <button data-t="footer" type="button">⚙️ الفوتر</button>
  </div>
  <main>
    <div class="stats" id="statsRow"></div>
    <div id="tabContent"></div>
  </main>
</div>

<!-- مودال السبب -->
<div class="overlay" id="reasonModal">
  <div class="modal">
    <h3 id="reasonTitle">السبب</h3>
    <textarea id="reasonText" placeholder="اكتب السبب هنا…"></textarea>
    <div class="row">
      <button class="m-ok" id="reasonOk">تأكيد ✅</button>
      <button class="m-no" id="reasonNo">إلغاء</button>
    </div>
  </div>
</div>

<!-- مودال تعديل مستخدم -->
<div class="overlay" id="editModal">
  <div class="modal">
    <h3>✏️ تعديل المستخدم</h3>
    <div class="fg"><label>الاسم</label><input type="text" id="eName"></div>
    <div class="fg"><label>الهاتف</label><input type="tel" id="ePhone" dir="ltr" style="text-align:end"></div>
    <div class="fg"><label>التخصص (للشركات)</label><input type="text" id="eCat"></div>
    <div class="row">
      <button class="m-ok" id="editOk">حفظ 💾</button>
      <button class="m-no" id="editNo">إلغاء</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
// ============================================================
// لوحة إدارة دارك — منفصلة، دخول المشرف فقط
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyBx9Mowie9zDbNH5ctGjtNKPqR88ffIMDU",
  authDomain: "dark-a4382.firebaseapp.com",
  projectId: "dark-a4382",
  storageBucket: "dark-a4382.firebasestorage.app",
  messagingSenderId: "384052348677",
  appId: "1:384052348677:web:47606de2fe238bbd77996c"
};
const ADMIN_EMAILS = ["m.alhinai11@gmail.com"];

let db, auth, storage;
let F = {}, S = {};

const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
F = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
const A = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
S = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js");
const app = initializeApp(firebaseConfig);
db = F.getFirestore(app);
auth = A.getAuth(app);
storage = S.getStorage(app);

const $ = id => document.getElementById(id);
function toast(msg, err = false) {
  const el = $("toast");
  el.textContent = msg;
  el.className = "show" + (err ? " err" : "");
  setTimeout(() => el.className = "", 2600);
}
const ts = d => d?.seconds ? d.seconds * 1000 : new Date(d || 0).getTime();
const fmtD = d => { const t = ts(d); return t ? new Date(t).toLocaleDateString("ar-OM") : "—"; };

// ====== الدخول ======
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("lBtn").disabled = true;
  $("lErr").textContent = "";
  try {
    await A.signInWithEmailAndPassword(auth, $("lEmail").value.trim(), $("lPass").value);
  } catch (err) {
    console.error(err);
    $("lErr").textContent = "بيانات الدخول غير صحيحة";
  } finally { $("lBtn").disabled = false; }
});
$("logoutBtn").addEventListener("click", () => A.signOut(auth));

A.onAuthStateChanged(auth, user => {
  if (user && ADMIN_EMAILS.includes(user.email)) {
    $("loginScreen").style.display = "none";
    $("adminApp").style.display = "block";
    loadAll();
  } else {
    $("adminApp").style.display = "none";
    $("loginScreen").style.display = "grid";
    if (user) { $("lErr").textContent = "⛔ هذا الحساب ليس مشرفًا"; A.signOut(auth); }
  }
});

// ====== تحميل كل البيانات ======
let USERS = [], REQUESTS = [], QUOTES = [], EMPLOYEES = [], ADS = null, FOOTER = null, CATS = null, TECHCATS = null;
async function loadAll() {
  try {
    const [u, r, tr, q, e, s] = await Promise.all([
      F.getDocs(F.query(F.collection(db, "users"))),
      F.getDocs(F.query(F.collection(db, "service_requests"))),
      F.getDocs(F.query(F.collection(db, "tech_requests"))),
      F.getDocs(F.query(F.collection(db, "quotes"))),
      F.getDocs(F.query(F.collection(db, "employees"))),
      F.getDocs(F.query(F.collection(db, "settings")))
    ]);
    USERS = u.docs.map(d => ({ docId: d.id, ...d.data() }));
    REQUESTS = [
      ...r.docs.map(d => ({ docId: d.id, _col: "service_requests", ...d.data() })),
      ...tr.docs.map(d => ({ docId: d.id, _col: "tech_requests", _tech: true, ...d.data() }))
    ].sort((a, b) => ts(b.createdAt) - ts(a.createdAt));
    QUOTES = q.docs.map(d => ({ docId: d.id, ...d.data() })).sort((a, b) => ts(b.createdAt) - ts(a.createdAt));
    EMPLOYEES = e.docs.map(d => ({ docId: d.id, ...d.data() }));
    s.docs.forEach(d => {
      if (d.id === "ads") ADS = d.data().slides;
      if (d.id === "footer") FOOTER = d.data();
        if (d.id === "categories") CATS = d.data().list;
      if (d.id === "tech_categories") TECHCATS = d.data().list;
    });
  } catch (e) { console.error(e); toast("تعذر تحميل البيانات — تحقق من القواعد", true); }
  renderAll();
}

function renderAll() {
  const comps = USERS.filter(u => u.role === "provider");
  const techs = USERS.filter(u => u.role === "tech");
  const clients = USERS.filter(u => u.role === "client");
  $("cntCompanies").textContent = comps.length;
  $("cntTechs").textContent = techs.length;
  $("cntClients").textContent = clients.length;
  $("cntRequests").textContent = REQUESTS.length;
  $("cntQuotes").textContent = QUOTES.length;
  $("cntEmployees").textContent = EMPLOYEES.length;
  const acc = QUOTES.filter(q => q.status === "accepted").length;
  const rej = QUOTES.filter(q => q.status === "rejected").length;
  $("statsRow").innerHTML = `
    <div class="stat"><b>${USERS.length}</b><span>إجمالي المستخدمين</span></div>
    <div class="stat"><b>${comps.length}</b><span>الشركات</span></div>
    <div class="stat o"><b>${USERS.filter(c => (c.role === "provider" || c.role === "tech") && c.status === "pending").length}</b><span>بانتظار الموافقة</span></div>
    <div class="stat"><b>${REQUESTS.length}</b><span>الطلبات</span></div>
    <div class="stat g"><b>${acc}</b><span>عروض مقبولة</span></div>
    <div class="stat r"><b>${rej}</b><span>عروض مرفوضة</span></div>`;
  switchTab(currentTab);
}

// ====== التبويبات ======
let currentTab = "overview";
document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.t)));
function switchTab(t) {
  currentTab = t;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  const box = $("tabContent");
  if (t === "overview") box.innerHTML = renderOverview();
  else if (t === "companies") box.innerHTML = renderUsers("provider");
  else if (t === "techs") box.innerHTML = renderUsers("tech");
  else if (t === "clients") box.innerHTML = renderUsers("client");
  else if (t === "requests") box.innerHTML = renderRequests();
  else if (t === "quotes") box.innerHTML = renderQuotes();
  else if (t === "employees") box.innerHTML = renderEmployees();
  else if (t === "cats") box.innerHTML = renderCatsForm();
  else if (t === "ads") box.innerHTML = renderAdsForm();
  else if (t === "footer") box.innerHTML = renderFooterForm();
  bindTabEvents(t);
}

const statusBadge = s =>
  s === "approved" ? '<span class="badge b-green">مفعّلة ✅</span>' :
  s === "pending" ? '<span class="badge b-amber">بانتظار ⏳</span>' :
  s === "rejected" ? '<span class="badge b-red">مرفوضة ⛔</span>' :
  s === "suspended" ? '<span class="badge b-gray">موقوفة 🚫</span>' : '<span class="badge b-green">مفعّلة ✅</span>';

function renderOverview() {
  const recent = REQUESTS.slice(0, 6);
  const pendingCos = USERS.filter(u => (u.role === "provider" || u.role === "tech") && u.status === "pending");
  return `
  <div class="card">
    <div class="card-h"><h2>⏳ شركات وفنيون بانتظار الموافقة (${pendingCos.length})</h2></div>
    ${pendingCos.length ? `<div class="tbl-wrap"><table><thead><tr><th>الاسم</th><th>النوع</th><th>التخصص</th><th>الهاتف</th><th>الإجراء</th></tr></thead><tbody>
      ${pendingCos.map(u => `<tr>
        <td data-l="الاسم"><b>${u.displayName || "—"}</b></td>
        <td data-l="النوع">${u.role === "tech" ? "🔧 فني" : "🏢 شركة"}</td>
        <td data-l="التخصص">${u.category || "—"}</td>
        <td data-l="الهاتف" dir="ltr">${u.phone || "—"}</td>
        <td data-l="الإجراء"><button class="abtn g" onclick="userAction('${u.uid}','approved')">قبول ✅</button><button class="abtn r" onclick="askReason('${u.uid}','rejected')">رفض ⛔</button></td>
      </tr>`).join("")}</tbody></table></div>` : '<div class="empty">لا يوجد طلبات انضمام بانتظار الموافقة 🎉</div>'}
  </div>
  <div class="card">
    <div class="card-h"><h2>🕐 أحدث الطلبات</h2></div>
    ${recent.length ? `<div class="tbl-wrap"><table><thead><tr><th>العميل</th><th>التخصص</th><th>المدينة</th><th>الميزانية</th><th>التاريخ</th></tr></thead><tbody>
      ${recent.map(r => `<tr>
        <td data-l="العميل"><b>${r.name || "—"}</b></td>
        <td data-l="التخصص">${r.category || "—"}</td>
        <td data-l="المدينة">${r.city || "—"}</td>
        <td data-l="الميزانية">${r.budget ? (+r.budget).toLocaleString("ar") + " ر.ع" : "—"}</td>
        <td data-l="التاريخ">${fmtD(r.createdAt)}</td>
      </tr>`).join("")}</tbody></table></div>` : '<div class="empty">لا توجد طلبات بعد</div>'}
  </div>`;
}

function renderUsers(role) {
  const list = USERS.filter(u => u.role === role);
  const title = role === "provider" ? "🏢 إدارة الشركات" : role === "tech" ? "🔧 إدارة الفنيين المستقلين" : "👤 إدارة العملاء";
  const hasCat = role === "provider" || role === "tech";
  return `
  <div class="card">
    <div class="card-h"><h2>${title} (${list.length})</h2>
      <div class="tools"><input type="search" id="userSearch" placeholder="بحث بالاسم أو البريد…"></div></div>
    ${list.length ? `<div class="tbl-wrap"><table id="usersTable"><thead><tr>
      <th>الاسم</th><th>البريد</th><th>الهاتف</th>${hasCat ? "<th>التخصص</th>" : ""}<th>الحالة</th><th>السبب</th><th>الإجراءات</th>
    </tr></thead><tbody>
      ${list.map(u => `<tr class="urow" data-q="${(u.displayName || "") + " " + (u.email || "")}">
        <td data-l="الاسم"><b>${u.displayName || "—"}</b></td>
        <td data-l="البريد" dir="ltr" style="font-size:.74rem">${u.email || "—"}</td>
        <td data-l="الهاتف" dir="ltr">${u.phone || "—"}</td>
        ${role === "provider" ? `<td data-l="التخصص">${u.category || "—"}</td>` : ""}
        <td data-l="الحالة">${statusBadge(u.status || "approved")}</td>
        <td data-l="السبب" style="font-size:.74rem;max-width:160px">${u.statusReason || "—"}</td>
        <td data-l="الإجراءات" style="white-space:nowrap">
          ${u.status !== "approved" ? `<button class="abtn g" onclick="userAction('${u.uid}','approved')">تفعيل ✅</button>` : ""}

// ====== بحث داخل الجداول ======
function bindSearch(inputId, rowClass) {
  const inp = $(inputId);
  if (!inp) return;
  inp.addEventListener("input", () => {
    const q = inp.value.trim();
    document.querySelectorAll("." + rowClass).forEach(r => {
      r.style.display = r.dataset.q.includes(q) ? "" : "none";
    });
  });
}
function bindTabEvents(t) {
  if (t === "companies" || t === "clients" || t === "techs") bindSearch("userSearch", "urow");
  if (t === "requests") bindSearch("reqSearch", "rrow");
  if (t === "cats") {
    $("catForm").addEventListener("submit", async e => {
      e.preventDefault();
      const list = catsList().slice();
      const item = { icon: $("cIcon").value.trim(), name: $("cName").value.trim(), en: $("cEn").value.trim() };
      const idx = +$("cIdx").value;
      if (idx >= 0) list[idx] = item; else list.push(item);
      await saveCats(list);
    });
  }
  if (t === "techcats") {
    $("techcatForm").addEventListener("submit", async e => {
      e.preventDefault();
      const list = techcatsList().slice();
      const item = { icon: $("tcIcon").value.trim(), name: $("tcName").value.trim(), en: $("tcEn").value.trim() };
      const idx = +$("tcIdx").value;
      if (idx >= 0) list[idx] = item; else list.push(item);
      await saveTechCats(list);
    });
  }
  if (t === "ads") {
    $("adsForm").addEventListener("submit", async e => {
      e.preventDefault();
      const slides = (ADS && ADS.length ? ADS : DEFAULT_ADS).map((a, i) => ({
        h: $("adH" + i).value.trim(), p: $("adP" + i).value.trim(),
        btn: $("adB" + i).value.trim(), link: $("adL" + i).value.trim(), img: a.img || ""
      }));
      try {
        for (let i = 0; i < slides.length; i++) {
          const f = $("adImg" + i).files[0];
          if (f) slides[i].img = await uploadImage(f, "ads");
        }
        await F.setDoc(F.doc(db, "settings", "ads"), { slides });
        ADS = slides;
        toast("تم حفظ الإعلانات ✅");
        switchTab("ads");
      } catch (err) { console.error(err); toast("تعذر الحفظ", true); }
    });
  }
  if (t === "footer") {
    $("footerForm").addEventListener("submit", async e => {
      e.preventDefault();
      try {
        await F.setDoc(F.doc(db, "settings", "footer"), {
          desc: $("fDesc").value.trim(), email: $("fEmail").value.trim(),
          phone: $("fPhone").value.trim(), location: $("fLoc").value.trim()
        });
        toast("تم حفظ الفوتر ✅");
      } catch (err) { console.error(err); toast("تعذر الحفظ", true); }
    });
  }
}

async function uploadImage(file, folder) {
  const sref = S.ref(storage, folder + "/" + Date.now() + "_" + file.name.replace(/[^\w.]/g, "_"));
  await S.uploadBytes(sref, file);
  return await S.getDownloadURL(sref);
}

async function findUserDoc(uid) {
  const snap = await F.getDocs(F.query(F.collection(db, "users"), F.where("uid", "==", uid)));
  return snap.docs[0] || null;
}
window.userAction = async function(uid, status, reason = "") {
  try {
    const d = await findUserDoc(uid);
    if (d) await F.updateDoc(F.doc(db, "users", d.id), { status, statusReason: reason });
    const u = USERS.find(x => x.uid === uid);
    if (u) { u.status = status; u.statusReason = reason; }
    toast("تم ✅");
    renderAll();
  } catch (e) { console.error(e); toast("فشل الإجراء", true); }
};
let reasonCb = null;
window.askReason = function(uid, action) {
  $("reasonTitle").textContent = action === "rejected" ? "⛔ سبب الرفض" : "🚫 سبب الإيقاف";
  $("reasonText").value = "";
  reasonCb = reason => userAction(uid, action, reason);
  $("reasonModal").classList.add("open");
};
$("reasonOk").addEventListener("click", () => {
  $("reasonModal").classList.remove("open");
  if (reasonCb) reasonCb($("reasonText").value.trim());
});
$("reasonNo").addEventListener("click", () => $("reasonModal").classList.remove("open"));

    await F.deleteDoc(F.doc(db, col, docId));
    REQUESTS = REQUESTS.filter(x => x.docId !== docId);
    toast("تم الحذف 🗑️");
    renderAll();
  } catch (e) { console.error(e); toast("فشل الحذف — حدّث قواعد Firestore", true); }
};

</script>
</body>
</html>
